<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="晚安营地">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="0.55" stop-color="#132a22"/>
      <stop offset="1" stop-color="#1d3326"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#e8b96a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e8b96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a86a"/>
      <stop offset="1" stop-color="#8a6b3c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#sky)"/>

  <!-- 夜空星星 -->
  <g fill="#ffeec6">
    <circle cx="120" cy="118" r="3.5" opacity="0.9"/>
    <circle cx="196" cy="86" r="2.2" opacity="0.7"/>
    <circle cx="268" cy="132" r="2.8" opacity="0.8"/>
    <circle cx="340" cy="96" r="2" opacity="0.6"/>
    <circle cx="392" cy="150" r="2.6" opacity="0.75"/>
    <circle cx="96" cy="196" r="2" opacity="0.55"/>
    <circle cx="164" cy="170" r="1.8" opacity="0.5"/>
    <circle cx="300" cy="196" r="1.8" opacity="0.5"/>
    <circle cx="420" cy="214" r="2.2" opacity="0.6"/>
  </g>

  <!-- 月亮 -->
  <circle cx="376" cy="126" r="34" fill="#f0e2b8" opacity="0.94"/>
  <circle cx="392" cy="114" r="30" fill="#101a22" opacity="0.92"/>

  <!-- 地平线 -->
  <path d="M0 336 Q 128 292 256 330 T 512 318 L512 512 L0 512 Z" fill="#16281f"/>

  <!-- 暖光 -->
  <ellipse cx="256" cy="392" rx="190" ry="86" fill="url(#lamp)"/>

  <!-- 帐篷 -->
  <path d="M256 268 L 372 430 L 140 430 Z" fill="url(#tent)"/>
  <path d="M256 268 L 306 430 L 206 430 Z" fill="#1a1208" opacity="0.45"/>
  <path d="M256 300 L 286 430 L 226 430 Z" fill="#ffdf9e" opacity="0.5"/>

  <!-- 地面 -->
  <rect x="0" y="428" width="512" height="84" fill="#0e1a14"/>
  <path d="M0 436 Q 96 424 192 434 T 384 430 T 512 438 L512 512 L0 512 Z" fill="#12211a"/>
</svg>
